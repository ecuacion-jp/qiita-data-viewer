# spring
spring.main.banner-mode=off
spring.profiles.active=profile
spring.web.error.path=/public/error

# ecuacion
jp.ecuacion.locale.use-root=true
jp.ecuacion.splib.web.process-result-message.shown-at-each-item=true
jp.ecuacion.splib.web.process-result-message.shown-at-the-top=false
jp.ecuacion.splib.web.navbar.default-page-path-account=/account/qiitaItem/searchList/page
jp.ecuacion.splib.web.navbar.default-page-path-admin=/admin/accGeneral/searchList/page
# Referenced unconditionally by ecuacion-splib-web (e.g. RedirectToHomePageException's static
# init), not just when actually redirecting - must always be set. No dedicated "home" page
# exists in this app, so this just points at the general-user landing page.
jp.ecuacion.splib.web.home-page=account/qiitaItem/searchList/page

# app
app.name=qiita-data-viewer
app.url.login=#{application:app.url.root}/public/login/page
app.url.admin-login=#{application:app.url.root}/public/adminLogin/page
