# spring
spring.thymeleaf.cache=false
spring.jpa.hibernate.ddl-auto=update

# app
app.url.root=http://localhost:8080
app.dir.app-data=./local-test/app-data

# OAuth2 client registration is intentionally left unset locally (no ClientRegistrationRepository
# bean gets created, so Google/Apple login stays disabled). Use the admin password login +
# impersonation to exercise the general-user screens locally.
